[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff with zero config resolves to a very large rule surface that varies by
# ruff release (observed: 70+ style/opinion findings across this codebase on
# ruff 0.16.7, including things like blind-except and datetime-without-tz
# checks that were never part of this project's lint gate). Pin the
# conservative, widely-used baseline explicitly so CI behavior is
# deterministic across ruff versions instead of drifting with `pip install
# ruff` picking up whatever is newest: E4/E7/E9 (pycodestyle error subset)
# plus F (pyflakes — unused imports/names, undefined names, etc).
select = ["E4", "E7", "E9", "F"]
