# RippleETA — Continuous Integration
#
# Runs on every push and pull-request to main/master.
# Scope: fast-path tests only (no data required).
#   - Unit tests that use synthetic data (graph, calibration, features, validation, API)
#   - The e2e test is skipped in CI because it needs the 10k-row CSV artifact
#     which is excluded from git.  It runs fine locally once the data is present.
#
# Why this matters: the timed event graph, anomaly gate, conformal calibration,
# and API contract are all tested with real synthetic scenarios — these are the
# differentiating parts of the system and worth protecting against regression.

name: CI

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} — lint, types, schemas, tests"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy

      - name: Lint with Ruff
        run: ruff check src/model_promotion.py tests/test_model_promotion.py jobs/nightly_recalibration.py

      - name: Type check with mypy
        run: mypy src/model_promotion.py --ignore-missing-imports

      - name: Validate Phase 1D data schemas
        run: pytest tests/test_validation.py -q

      - name: Run fast unit + API tests (no data required)
        run: |
          pytest tests/ \
            --ignore=tests/test_pipeline_e2e.py \
            -v \
            --timeout=120 \
            --tb=short \
            -q
        env:
          # Prevent accidental writes to models/ during CI
          RIPPLEETA_CI: "1"
