calibration:
  anomaly_multiplier: 0.001
  coverage_target: 0.9
data:
  processed_path: data/processed/kaggle_competition_cleaned.parquet
  raw_path: data/raw/train_delay.csv
logging:
  level: INFO
model:
  cal_fraction: 0.85
  learning_rate: 0.1
  max_depth: 6
  n_estimators: 100
  n_jobs: 1
  objective: reg:squarederror
  random_state: 42
  train_fraction: 0.7
validation:
  max_missing_fraction: 0.05
  min_rows: 100
  ranges:
    actual_delay_minutes:
    - 0
    - 1440
    distance_km:
    - 0
    - 5000
    scheduled_travel_hours:
    - 0
    - 100
